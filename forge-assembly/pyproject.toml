[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-assembly"
version = "0.1.0"
description = "FORGE Assembly & DFA skill: placement, interference, tool access, disassembly, maintenance"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geometry = [
    "trimesh>=4.0",
    "scipy>=1.12",
]
dev = [
    "pytest>=7.4",
    "forge-assembly[geometry]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
