[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forge-tools"
version = "0.1.0"
description = "FORGE Python tooling: MCP wrapper utilities, test harness, fixture generators"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]
mcp = [
    # MCP SDK — populate when available
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = [
    "forge-tests",
    "tests",
    "tools/tests",
    "forge_agent/tests",
    "forge-assembly/tests",
    "forge-output/tests",
]
pythonpath = [".", "dark-leaf-v2/python"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
