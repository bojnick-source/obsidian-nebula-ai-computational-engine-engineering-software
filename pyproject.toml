[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "forge"
version = "0.1.0"
description = "FORGE — AI Computational Engine for Engineering Software"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FORGE Contributors"},
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
providers = [
    "httpx>=0.27",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
