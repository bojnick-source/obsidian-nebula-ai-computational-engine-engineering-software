[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mesh-morph-lhs"
version = "0.1.0"
description = "Mesh-LHS Morphogenesis Engine — parameterized lattice generation, LHS sampling, truss FEM, multi-objective optimization"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
mesh-morph = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
