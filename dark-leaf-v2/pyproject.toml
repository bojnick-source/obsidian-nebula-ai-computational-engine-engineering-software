[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-leaf-v2"
version = "2.0.0"
description = "REIDCE physics solvers and SFCS MDP digital-thread stack"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
