name: Vault Integrity

on:
  push:
    paths:
      - "forge-vault/**"
  schedule:
    - cron: "0 4 * * *"  # Daily 04:00 UTC
  workflow_dispatch:

jobs:
  frontmatter-validation:
    name: Validate vault frontmatter schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install pyyaml
      - name: Validate frontmatter
        run: python tools/validate_vault_frontmatter.py

  stale-index-check:
    name: Check stale note index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install pyyaml
      - name: Check stale index
        run: python tools/check_stale_vault_index.py

  backup-snapshot:
    name: Create vault snapshot
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Create snapshot
        run: |
          echo "Snapshot placeholder — implement vault backup per docs/ops/backup-recovery.md"
