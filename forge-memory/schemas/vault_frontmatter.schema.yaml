$schema: "forge/vault/frontmatter/v1"
title: "Vault Frontmatter Schema v1"
description: |
  Schema for all notes written to the forge-vault.
  All fields are in the YAML frontmatter block at the top of each note.

required:
  - id
  - type
  - domain
  - created_at
  - updated_at
  - trace_id
  - agent_id
  - agent_version
  - confidence
  - pathway_strength

properties:
  id:
    type: string
    description: UUID v4 assigned at note creation
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

  type:
    type: string
    enum: [finding, derivation, decision, gap, synthesis, agent-thinking, ilc-link]

  domain:
    type: string
    enum:
      - mechanical_engineering
      - materials
      - electrical_engineering
      - plasma
      - magnetics
      - controls
      - thermal_fluids
      - acoustics
      - safety_se
      - biomedical
      - mathematics
      - cross_domain

  created_at:
    type: string
    format: date-time

  updated_at:
    type: string
    format: date-time

  trace_id:
    type: string
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

  agent_id:
    type: string

  agent_version:
    type: string
    description: semver e.g. "1.0.0"

  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0

  pathway_strength:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Initialized to 0.1; incremented on each access

  # Optional fields
  project:
    type: string
    enum: [aladdin-3b, project-vanguard, phoenix, cross_project]

  component:
    type: string

  units:
    type: string
    description: SI units of primary result (required for finding type with numeric result)

  provenance:
    type: object
    properties:
      source:
        type: string
      specificity:
        type: string
        enum: [high, medium, low]
      citation:
        type: string
      last_verified:
        type: string
        format: date-time

  tags:
    type: array
    items:
      type: string

  related_notes:
    type: array
    items:
      type: string
      description: Note IDs

  gap_flags:
    type: array
    items:
      type: string

  assumptions:
    type: array
    items:
      type: string

  what_would_falsify:
    type: array
    items:
      type: string

  superseded_by:
    type: string

  disputes:
    type: array
    items:
      type: string

  dispute_status:
    type: string
    enum: [open, resolved, escalated]

  last_accessed:
    type: string
    format: date-time

  access_count:
    type: integer
    minimum: 0

  review_flagged:
    type: boolean

version: "v1"
frozen_at: "2026-03-05"
