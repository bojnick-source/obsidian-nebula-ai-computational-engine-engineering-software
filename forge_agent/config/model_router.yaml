  # ── Production / synthesis roles ──────────────────────────────

  math_synthesizer:
    preferred_provider: anthropic
    model_tier: primary           # claude for synthesis + unification
    temperature: 0.1
    max_tokens: 4096
    fallback_provider: openai
    fallback_tier: primary

  context_compressor:
    preferred_provider: anthropic
    model_tier: routing           # haiku for fast compression
    temperature: 0.0
    max_tokens: 512
    fallback_provider: openai
    fallback_tier: routing

  knowledge_extractor:
    preferred_provider: anthropic
    model_tier: secondary         # sonnet — extracts durable knowledge
    temperature: 0.1
    max_tokens: 2048
    fallback_provider: openai
    fallback_tier: secondary
