# Prompt test: topology_optimization — happy path with Swan, lattice recommendation
#
# Verifies that with Swan available, valid quantified loads, and a volume fraction
# in the aerospace-typical range, the agent:
#   1. Selects Swan as solver (preferred over ToPy/OpenMDAO/scipy)
#   2. Converges to a connected topology
#   3. Interprets the density field correctly (lattice_fraction > solid_fraction
#      → use_lattice_infill recommendation)
#   4. Writes vault with status=validated and correct frontmatter
#   5. Produces a complete topology_handoff with a concrete picogk_instruction
#
# Run:  forge prompt-test run topology_optimization test_happy_path_swan_lattice_handoff

id: test_happy_path_swan_lattice_handoff
agent: topology_optimization
version: "1.0.0"
description: >
  Full happy-path run for C-001 fuselage shell using Swan. Volume fraction 0.30,
  converged, connected topology, density field recommends lattice infill (solid
  fraction ~0.42, lattice fraction ~0.35). topology_handoff produced with
  ready_for_picogk=true and a concrete picogk_instruction.

# ── Input ─────────────────────────────────────────────────────────────────────

input:
  component_id: C-001
  project_name: Aladdin-3B
  spec_vault_path: "projects/Aladdin-3B/components/C-001_spec.md"
  volume_fraction_target: 0.30
  mesh_resolution_mm: 2.0
  swan_available: true

  load_cases:
    - id: LC-001
      description: "Wing root bending — 9g pull-up, left spar"
      magnitude_N: 1250.0
      direction: [0, 1, 0]
      application_node: "wing_spar_interface_left"
    - id: LC-002
      description: "Wing root bending — 9g pull-up, right spar"
      magnitude_N: 1250.0
      direction: [0, 1, 0]
      application_node: "wing_spar_interface_right"
    - id: LC-003
      description: "Motor thrust — max continuous"
      magnitude_N: 480.0
      direction: [1, 0, 0]
      application_node: "motor_mount_center"
    - id: LC-004
      description: "Payload gravity — 9g"
      magnitude_N: 88.3       # 1 kg × 9g × 9.81 m/s²
      direction: [0, 0, -1]
      application_node: "payload_bay_floor_center"

  boundary_conditions:
    - node_group: "fuselage_frame_attachment_ring"
      constrained_dofs: [1, 2, 3, 4, 5, 6]

  non_design_solid: ["motor_mount_bolt_bosses", "wing_spar_tube_interfaces"]
  non_design_void:  ["payload_bay", "fuel_line_routing_channel"]

  # Simulated Swan optimization result
  simulated_optimization_result:
    solver: swan
    swan_version: "0.9.2"
    iterations: 147
    converged: true
    convergence_tol_achieved: 0.0082
    volume_fraction_achieved: 0.291    # within ±2% of 0.30 target
    compliance_initial: 0.1820
    compliance_final:   0.0391
    density_field_stats:
      n_elements: 189450
      n_solid_elements: 79610          # density >= 0.5 → 42.0%
      n_lattice_elements: 66310        # density 0.2–0.5 → 35.0%
      n_void_elements: 43530           # density < 0.2 → 23.0%
      solid_fraction: 0.420
      lattice_fraction: 0.350
      void_fraction: 0.230
    connectivity_check:
      n_components: 1
      load_path_connected: true
    mass_reduction_pct: 58.0           # relative to fully solid design space

# ── Assertions ────────────────────────────────────────────────────────────────

assertions:
  # Solver selection — Swan must be chosen
  - type: field_value
    field: solver_used
    expected: "swan"
    description: >
      Swan is the preferred solver. When swan_available=true, ToPy and
      scipy SIMP must not be used. Swan version must be recorded.

  - type: output_contains
    target: vault_frontmatter
    one_of: ["swan", "0.9.2"]
    description: Swan version must appear in the vault frontmatter.

  # Convergence
  - type: field_value
    field: converged
    expected: "true"
    description: Optimization must report converged=true.

  - type: field_value_lte
    field: iterations
    max: 200
    description: Iterations must be ≤ max_iterations=200.

  # Volume fraction tolerance (±2%)
  - type: field_value_in_range
    field: volume_fraction_achieved
    min: 0.28
    max: 0.32
    description: >
      Achieved volume fraction must be within ±2% of the 0.30 target.
      A deviation > 2% means the optimality criteria update has not
      converged and the result is unreliable.

  # Load path connectivity
  - type: field_value
    field: load_path_connected
    expected: "true"
    description: >
      Solid region must be connected (n_components=1). A disconnected solid
      region must block ready_for_picogk regardless of all other metrics.

  # Density interpretation — lattice recommended (0.2 < solid_fraction ≤ 0.7)
  - type: field_value
    field: recommendation
    expected: "use_lattice_infill"
    description: >
      solid_fraction=0.42 is in the range (0.2, 0.7] → use_lattice_infill.
      use_solid_geometry (solid_fraction > 0.7) and void (solid_fraction ≤ 0.2)
      must not be selected.

  # Mass reduction recorded
  - type: field_value_in_range
    field: mass_reduction_pct
    min: 55.0
    max: 75.0
    description: >
      At volume_fraction=0.29, mass reduction relative to fully solid is
      approximately 58%. Vault must record the computed value, not the
      volume fraction target.

  # Vault write — both paths present
  - type: field_contains_all
    field: vault_paths_written
    values:
      - "projects/Aladdin-3B/components/C-001_topology.md"
      - "projects/Aladdin-3B/components/C-001_density.npy"
    description: Both vault artifacts must be written.

  # Frontmatter status
  - type: field_value
    field: vault_frontmatter.status
    expected: "validated"
    description: >
      status=validated only when ALL of: converged=true, load_path_connected=true,
      volume_fraction_achieved within ±2%. Any failure → status=failed.

  - type: field_value
    field: vault_frontmatter.solver
    expected: "swan"
    description: Solver must be recorded in frontmatter for reproducibility.

  # topology_handoff — all required fields
  - type: output_present
    field: topology_handoff
    description: topology_handoff XML block must be produced.

  - type: field_value
    field: topology_handoff.component_id
    expected: "C-001"

  - type: field_value
    field: topology_handoff.recommendation
    expected: "use_lattice_infill"

  - type: field_value
    field: topology_handoff.load_path_connected
    expected: "true"

  - type: field_value
    field: topology_handoff.ready_for_picogk
    expected: "true"

  # picogk_instruction must be concrete — density thresholds, not vague
  - type: output_contains
    target: topology_handoff.picogk_instruction
    one_of:
      - "0.5"
      - "0.2"
      - "gyroid"
      - "solid"
      - "lattice"
    description: >
      picogk_instruction must give picogk-geometry actionable thresholds.
      "Apply lattice infill" without specifying which density band maps to
      lattice forces picogk to guess at thresholds — it may apply Noyron
      gyroid to regions that should be solid (density 0.6, not 0.35) or
      leave intermediate-density regions as solid (missing the mass saving).

  # Density path in handoff
  - type: field_value
    field: topology_handoff.density_array_path
    expected: "projects/Aladdin-3B/components/C-001_density.npy"
    description: >
      density_array_path must point to the actual numpy file written to
      vault. picogk-geometry loads this array to drive solid/lattice/void
      placement.

# ── Expected behavior summary ─────────────────────────────────────────────────

expected_behavior: |
  Agent checks solver availability: Swan found (v0.9.2).
  Builds FEniCS mesh from design space params; applies load cases LC-001
  through LC-004 and BCs at fuselage_frame_attachment_ring.
  Runs Swan SIMP: converges at iteration 147, change=0.0082 < tol=0.01.
  volume_fraction_achieved=0.291 (within ±2% of 0.30 ✅).

  Interprets density field:
    solid_fraction=0.420 (density >= 0.5)
    lattice_fraction=0.350 (density 0.2–0.5)
    void_fraction=0.230 (density < 0.2)
    0.20 < solid_fraction=0.42 ≤ 0.70 → recommendation: use_lattice_infill
    mass_reduction_pct = (1 - 0.42) × 100 = 58.0%

  Connectivity check: n_components=1 ✅  load_path_connected=true ✅

  Writes vault:
    C-001_topology.md — frontmatter: solver=swan, status=validated,
    volume_fraction_achieved=0.291, mass_reduction_pct=58.0, iterations=147
    C-001_density.npy — numpy array shape (189450,)

  Emits topology_handoff:
    ready_for_picogk=true
    picogk_instruction: "Apply gyroid lattice (Noyron) to intermediate-density
    regions (0.2 ≤ density < 0.5); use solid CFRP geometry for high-density
    regions (density ≥ 0.5); remove material in void regions (density < 0.2)"
    recommendation: use_lattice_infill
    estimated_mass_reduction_pct: 58.0

failure_mode_tested: >
  If picogk_instruction is vague ("apply lattice infill where needed"), the
  picogk-geometry agent must interpret the density field itself without
  guidance. It might:
    (a) Apply Noyron gyroid to ALL non-solid regions including density=0.6
        areas that should be solid — correct mass reduction but structurally
        inadequate (gyroid at density 0.6 is not as stiff as solid CFRP).
    (b) Treat the entire field as solid (ignoring lattice recommendation) —
        saves no mass, defeats the purpose of topology optimization.
    (c) Apply a hardcoded 50% lattice fraction with no relationship to the
        actual density field — the lattice geometry does not match the load
        paths identified by the optimizer.
  In all three cases, simulation-fea runs on geometry that is either over- or
  under-engineered relative to what the optimizer prescribed, and the structural
  verifier cannot detect the mismatch because it sees the FEA result, not the
  topology density field.
