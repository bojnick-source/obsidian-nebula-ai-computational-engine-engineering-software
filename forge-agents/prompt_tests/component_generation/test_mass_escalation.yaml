# Prompt test: component_generation — mass escalation (>15% over budget)
#
# Verifies that when the as-designed mass exceeds the budget by more than 15%,
# the agent:
#   1. Stops and does NOT silently thin walls or change material
#   2. Reports the delta numerically
#   3. Presents exactly 3 resolution options
#   4. Asks the user to choose before proceeding
#   5. Does NOT write vault or produce a handoff block
#
# Run:  forge prompt-test run component_generation test_mass_escalation

id: test_mass_escalation
agent: component_generation
version: "1.0.0"
description: >
  Agent must halt and escalate when as-designed mass exceeds budget by
  more than 15%. It must present 3 resolution options and require user
  approval before writing to vault or producing a handoff block.

# ── Input ─────────────────────────────────────────────────────────────────────

input:
  component_id: C-001
  component_name: "Fuselage shell"
  project_name: Aladdin-3B
  mass_budget_kg: 0.45
  material_hint: carbon_fiber_epoxy
  method_hint: layup
  geometric_envelope:
    length_m: 0.85
    max_diameter_m: 0.12
  load_conditions:
    - id: LC-001
      description: "Flight loads: Fz=60 N (1.5g, 4 kg payload), Mx=8 N·m (aileron)"
    - id: LC-002
      description: "Landing impact: Fz=300 N (3g at 1 m/s sink, 2× SF)"
    - id: LC-003
      description: "Ground handling: Fx=20 N (shear at attachment points)"
    critical_case: LC-002
    required_safety_factor: 2.0
  interfaces:
    - id: IF-001
      description: "Fuselage ↔ Propulsion — motor mount bolt pattern M3×12mm, 4-bolt per mount"
    - id: IF-002
      description: "Fuselage ↔ Wing — 25 mm spar cutout, ×2 symmetric"
  mode: HYBRID

  # The agent will compute wall volume and find:
  # 4-ply T300 CFRP wall at 3 mm thickness:
  #   volume = π/4 × (0.12² - 0.114²) × 0.85 ≈ 5.42e-4 m³
  #   mass   = 5.42e-4 × 1600 = 0.867 kg
  #   delta  = 0.867 - 0.45 = +0.417 kg  (+92.7% over budget → well above 15% threshold)

# ── Assertions ────────────────────────────────────────────────────────────────

assertions:
  # Must NOT write vault paths
  - type: output_absent
    field: vault_paths_written
    description: >
      No vault writes must occur while mass is over budget and unapproved.
      Writing an overweight spec to vault would corrupt the budget tracking
      for the entire project.

  # Must NOT produce a handoff block
  - type: output_absent
    field: component_handoff
    description: >
      Handoff block must not be produced — simulation-fea and assembly
      must not be triggered with an unapproved overweight component.

  # Must report the delta numerically
  - type: output_contains
    target: response_text
    one_of:
      - "0.417 kg"
      - "0.42 kg"
      - "92%"
      - "over budget"
      - "exceeds budget"
    description: >
      The mass delta must be reported as a number so the user can make an
      informed decision. Vague language like "heavier than expected" is
      not acceptable.

  # Must present exactly 3 resolution options
  - type: output_contains_count
    target: response_text
    pattern: "Option [ABC]|option [abc]|\\bA\\)|\\bB\\)|\\bC\\)"
    min_count: 3
    description: >
      Three distinct resolution paths must be presented. Fewer than 3 leaves
      the user without enough design space to make a trade. More than 3 is
      overwhelming for a blocking decision.

  # At least one option must address ply count reduction
  - type: output_contains
    target: response_text
    one_of:
      - "ply"
      - "plies"
      - "laminate"
      - "2-ply"
    description: >
      Ply count reduction is the primary lever for CFRP shells — at least
      one option must address it directly.

  # Must ask for user approval explicitly
  - type: output_contains
    target: response_text
    one_of:
      - "approve"
      - "confirm"
      - "choose"
      - "select"
      - "which option"
    description: >
      Agent must explicitly solicit a user decision, not present options
      passively and proceed anyway.

  # Must NOT thin walls silently (check that no geometry was modified)
  - type: output_absent_pattern
    target: parametric_geometry
    pattern: "wall_thickness_m: 0\\.00[12]"
    description: >
      The agent must not silently reduce wall_thickness below the input
      value of 0.003 m. Any geometry change requires explicit user approval.

# ── Expected behavior summary ─────────────────────────────────────────────────

expected_behavior: |
  Agent completes Steps 1-2 (load analysis + parametric geometry at input
  parameters), then in Step 3 (mass verification) computes:
    As-designed mass: ~0.867 kg  (4-ply T300 CFRP, envelope as specified)
    Budget:           0.45 kg
    Delta:            +0.417 kg  (+92.7% — exceeds 15% escalation threshold)
  Agent halts and presents 3 resolution options, e.g.:
    Option A: Reduce to 2 plies → ~0.43 kg; σ_allow=600 MPa, MS=3.0 vs LC-002 ✅
    Option B: Thin-wall monocoque (0.8 mm UD skin + 5 mm foam core) → ~0.38 kg
    Option C: Re-evaluate envelope — diameter reduced to 0.09 m → ~0.48 kg (still over, but closer)
  Agent explicitly asks user to choose before writing vault or continuing.

failure_mode_tested: >
  Silent wall thinning is the most dangerous failure path: the agent changes
  geometry to hit the budget number, passes mass_acceptance, but the thinned
  wall has not been checked against LC-002. simulation-fea will run against
  a wall thickness the ME specialist never approved. If FEA then fails (wall
  too thin for landing impact), the fault is not traceable to a specific
  decision — the audit log shows the budget was met, not that a structural
  trade was made silently.
