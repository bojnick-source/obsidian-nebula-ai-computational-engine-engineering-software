notes: |
  Antagonist debate is V1 only. At MVP, single-specialist path with no debate.
  Debate is activated by SWITCH_NO_ANTAGONIST being OFF (default in full mode).

  Pair activation rules:
  - MVP: no debate — single specialist path only
  - V1: per-domain antagonist active for specialist↔antagonist pairs
  - V1: physics_antagonist active for all physics agent outputs
  - V1: mathematics_antagonist active for all math agent outputs
  - V2: academic_peer_reviewer as universal final-authority gate

  Verdict hierarchy (when multiple antagonists active):
  1. physics_antagonist / mathematics_antagonist — domain-specific fatal conditions
  2. specialist-domain antagonist — engineering/domain objections
  3. academic_peer_reviewer — cross-domain consistency, reproducibility, pre-pub gate
  academic_peer_reviewer may override lower-authority verdicts in panel review context.

  reviewer field (optional): specifies which agent provides the final arbiter verdict.
  If omitted, forge_arbiter resolves impasse through majority-vote protocol.
