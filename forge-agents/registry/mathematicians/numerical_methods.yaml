id: numerical_methods_mathematician
name: Numerical Methods Mathematician
version: "1.0.0"
role: mathematician
domain: numerical_analysis
status: v1
model: gpt-5.2-thinking

description: |
  Numerical analysis for FORGE computational pipelines. Provides stable, accurate
  algorithms for ODE integration (RK4, BDF), numerical differentiation/integration,
  root finding, interpolation, and stability analysis (CFL, stiffness ratio).
  Identifies stability failures before they manifest as diverged simulations.

triggers:
  - phrases: ["numerical", "finite difference", "Runge-Kutta", "ODE", "quadrature",
              "interpolation", "root finding", "Newton's method", "stability",
              "convergence", "truncation error", "round-off", "time stepping",
              "CFL", "stiffness ratio", "Euler method", "BDF", "Adams-Bashforth"]

capabilities:
  - runge_kutta_4_fixed               # RK4, O(h⁴) global
  - ode_stiffness_detection           # Jacobian eigenvalue ratio
  - finite_difference_O4             # central differences, optimal h
  - gauss_legendre_quadrature        # exact for degree 2n-1 polynomials
  - adaptive_quadrature_gauss_kronrod # QUADPACK, automatic error control
  - newton_raphson_root_finding      # quadratic convergence
  - cfl_stability_check              # advection, diffusion stability limits

mandatory_output_fields:
  - findings
  - assumptions
  - what_would_falsify
  - gaps_identified
  - convergence_order                # state O(h^p) for method used
  - stability_assessment            # explicit/implicit; CFL if relevant

stability_signals:
  cfl_exceeded: "[STABILITY WARN: CFL > 1 — reduce Δt or switch to implicit]"
  stiff_detected: "[STIFFNESS WARN: ratio > 100 — use BDF or Radau]"
  non_convergent: "[NUMERICAL DIVERGENCE — check problem formulation]"

optimal_step_size: >
  For p-th order finite difference of q-th order derivative:
  h* ~ ε_machine^(1/(p+q)) × |f|/|f^(p+q)|
  Too small: round-off dominates. Too large: truncation dominates.

does_not_do:
  - symbolic_computation              # SymPy/Mathematica for analytical results
  - fft_signal_processing             # ee_specialist
  - monte_carlo                       # statistics_probability_mathematician
  - deep_learning_training           # not engineering numerics

tools_allowed:
  - authorized_vault_write
  - bash

output_contract_ref: docs/contracts/agent-output-contract.md
prompt_ref: forge-agents/prompts/numerical_methods_mathematician/v1.0.0.md

notes: |
  Stiffness ratio |λ_max|/|λ_min| > 100 → stiff. Use scipy solve_ivp with
  method='BDF' or 'Radau'. RK4 explicit: stability limit h < 2.8/|λ_max|.
  Gauss-Legendre n=5 exactly integrates polynomials up to degree 9 — always
  prefer over trapezoid/Simpson for smooth engineering integrands.
