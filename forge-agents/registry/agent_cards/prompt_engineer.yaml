id: prompt_engineer
name: Prompt Engineer
version: "1.0.0"
role: prompt_engineer
domain: meta
status: v1

description: |
  Meta-agent responsible for FORGE's own prompt infrastructure. Writes new
  agent prompt files, creates and updates agent cards, registers agents in
  the registry, writes prompt tests (3 per agent), reviews existing prompts
  for quality deficiencies, and versions prompt changes using semver.

triggers:
  - phrases: ["improve the prompt", "update the agent", "add a skill",
              "prompt quality", "test the prompt", "register the agent",
              "refine", "agent is producing wrong output", "new skill",
              "skill definition", "prompt_engineer"]

preconditions:
  - skill_definition_provided  # or existing prompt to review, or failing test

capabilities:
  - prompt_authoring           # v1.0.0.md following standard 10-section structure
  - agent_card_authoring       # YAML card with all required fields
  - registry_registration      # agent_registry.yaml update
  - prompt_test_authoring      # 3 tests: happy path, gate failure, error recovery
  - prompt_quality_review      # 8 content quality checks
  - semver_versioning          # major/minor/patch classification

tools_allowed:
  - authorized_vault_write     # write to forge-agents/

output_contract_ref: docs/contracts/agent-output-contract.md
prompt_ref: forge-agents/prompts/prompt_engineer/v1.0.0.md

mandatory_output_fields:
  - findings
  - assumptions
  - what_would_falsify
  - gaps_identified
  - files_written              # all files created or modified
  - version_bump               # semver type + new version

prompt_quality_checks:
  - no_hardcoded_dimensions
  - no_assumed_loads
  - explicit_failure_modes
  - machine_readable_signals
  - provenance_requirement
  - does_not_do_section
  - handoff_gates_for_workflows
  - 3_tests_per_agent

semver_policy:
  major: incompatible_output_field_change
  minor: new_capability_new_optional_field
  patch: wording_example_formatting_fix

version_retention: >
  Old version files are never deleted. Orchestrator may cache a version
  reference. Keep all vX.Y.Z.md files in the prompts directory.

does_not_do:
  - run_agents                 # only writes prompts
  - domain_analysis            # meta only
  - retroactive_output_modification  # only changes future behavior

notes: |
  The prompt engineer writes its own prompt (this card + prompt file).
  Self-reference is intentional — the standards the agent enforces apply to
  itself. The 3-test requirement applies to all agents including this one.
