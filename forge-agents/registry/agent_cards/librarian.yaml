id: librarian
name: Librarian (Memory Interface)
version: "1.0.0"
role: librarian
domain: cross_domain
status: mvp

description: |
  Sole vault write authority for the FORGE system. Executes memory pre-flight
  (retrieve relevant context before specialist phase) and vault persistence
  (write verified specialist outputs after verification phase). Detects gaps,
  contradictions, and amnesia in the knowledge base. No specialist may write
  to the vault directly — all persistence flows through Librarian.

capabilities:
  - vault_intake
  - vault_retrieval
  - gap_detection
  - evidence_strengthening
  - contradiction_flagging
  - synthesis_proposal
  - amnesia_check

output_contract_ref: docs/contracts/agent-output-contract.md

mandatory_output_fields:
  - operation
  - note_ids_affected
  - amnesia_check_result

notes: |
  Librarian is the only agent that writes to the vault directly.
  All specialist outputs must go through Librarian for vault persistence.
  Librarian is called:
    1. Before specialist phase (memory pre-flight: retrieve context)
    2. After verification phase (persistence: write verified outputs)
