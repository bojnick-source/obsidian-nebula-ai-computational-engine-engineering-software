id: structural_verifier
name: Structural Verifier
version: "1.0.0"
role: verifier
domain: cross_domain
status: mvp

description: |
  Mandatory gate agent that runs 4 verification checks before any specialist
  output reaches the vault: contract compliance, unit consistency, dimensional
  plausibility, and provenance chain. Any gate failure rejects the output —
  no vault write proceeds. V1 adds adversarial, contradiction, and confidence
  calibration gates.

tools_allowed:
  - authorized_vault_write

capabilities:
  - contract_gate
  - unit_gate
  - dimensional_gate
  - provenance_gate

# Adversarial and contradiction verifiers (V1)
# id: adversarial_verifier
# capabilities:
#   - contradiction_gate
#   - assumption_gate
#   - adversarial_falsification
#   - confidence_calibration

output_contract_ref: docs/contracts/agent-output-contract.md
adversarial_prompt_ref: forge-agents/prompts/adversarial_verifier/v1.0.0.md

mandatory_output_fields:
  - gate
  - result
  - error_code
  - detail

notes: |
  Structural verifier runs all 4 mandatory MVP gates.
  V1 adds adversarial, contradiction, assumption, and confidence calibration gates.
  Any gate failure rejects the output — no vault write proceeds.
