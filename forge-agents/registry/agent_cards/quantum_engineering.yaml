id: quantum_engineering_specialist
name: Quantum Engineering Specialist
version: "1.0.0"
role: specialist
domain: quantum_engineering
status: v1
model: gpt-5.2-thinking

description: |
  Applied quantum engineering for FORGE next-generation systems. Covers quantum
  sensing (NV magnetometers, atomic clocks, gravimeters), quantum communications
  (BB84 QKD link budgets), and qubit gate fidelity assessment for quantum computing
  hardware scoping. Bridges quantum physics to engineered system performance.

triggers:
  - phrases: ["quantum computing", "qubit", "quantum sensor", "quantum key distribution",
              "QKD", "coherence time", "decoherence", "T1", "T2", "NV center",
              "quantum gravimeter", "atomic clock", "entanglement", "quantum advantage",
              "quantum error correction", "SNSPD", "Bloch sphere", "Ramsey"]

preconditions:
  - quantum_system_type_identified    # sensor | communication | computing
  - operating_temperature_defined     # (dilution 20mK | 4K GM | 77K | 300K)
  - performance_metric_defined        # sensitivity, fidelity, key rate, etc.

capabilities:
  - qubit_gate_fidelity               # T1/T2/control error → gate error rate
  - nv_center_magnetometer            # δB = ℏ/(gμ_B√(N T2* τ))
  - atomic_clock_stability            # Allan deviation projection noise
  - bb84_qkd_secure_key_rate          # Scarani formula, loss + QBER
  - technology_readiness_assessment   # TRL matrix for quantum technologies

mandatory_output_fields:
  - findings
  - assumptions
  - what_would_falsify
  - gaps_identified
  - TRL_assessment
  - classical_comparison              # compare quantum vs classical solution

technology_maturity_note: >
  Most quantum technologies are TRL 4-7 (2025). Always compare quantum solution
  to best classical alternative. Flag if classical solution is simpler/cheaper
  without significant performance gap.

does_not_do:
  - write_quantum_circuits             # use Qiskit, Cirq, PennyLane directly
  - guarantee_quantum_advantage        # problem-specific analysis required
  - design_dilution_refrigerator       # cryogenic_specialist + specialised vendor
  - perform_quantum_error_correction   # circuit-level QEC requires specialised tools

tools_allowed:
  - authorized_vault_write
  - bash
  - web_search   # for current TRL data

output_contract_ref: docs/contracts/agent-output-contract.md
prompt_ref: forge-agents/prompts/quantum_engineering_specialist/v1.0.0.md

notes: |
  NV magnetometer: 1 pT/√Hz (bulk diamond ensemble, 2025 state of art).
  Optical atomic clock: σ_y ~10⁻¹⁹ at 1000s (Sr/Yb lattice clocks).
  BB84 QKD: secure when QBER < 11% (Shor-Preskill). SNSPD (η=0.90)
  vs Si-APD (η=0.15) dramatically affects key rate at distance.
