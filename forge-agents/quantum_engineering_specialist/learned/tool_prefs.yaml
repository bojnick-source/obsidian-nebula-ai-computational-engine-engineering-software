agent_id: "quantum_engineering_specialist"
level: 1
runs_completed: 0

simulator_preferences:
  primary: "Qiskit_Aer"
  mode: "statevector"        # statevector (noiseless) | density_matrix (noisy)
  shots: 8192                # default shot count for sampling mode

noise_model_preferences:
  default: "depolarising"
  depolarising_error_rate: 0.001   # 0.1% per gate (NISQ-era typical)
  readout_error_rate: 0.01
  error_mitigation: "zero_noise_extrapolation"

