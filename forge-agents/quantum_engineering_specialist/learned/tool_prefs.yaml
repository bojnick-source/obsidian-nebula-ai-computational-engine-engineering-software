algorithm_defaults:
  vqe_initialisation: "random"        # random | fixed_point
  qaoa_layers: 1                      # p parameter
  grover_iterations: "optimal"        # floor(pi/4 * sqrt(N/M))

escalation_thresholds:
  depth_times_error_rate: 0.1         # trigger [HARDWARE NOISE MODEL REQUIRED]
  vqe_qubit_barren_plateau: 50        # qubit count above which barren plateau risk raised

