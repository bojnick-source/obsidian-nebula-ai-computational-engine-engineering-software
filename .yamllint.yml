---
extends: default

ignore: |
  briefcase/node_modules/
  node_modules/
  .github/workflows/
  dark-leaf-v2/manufacturing/
  dark-leaf-v2/cpp/v2/engine/build/

rules:
  line-length:
    max: 120
  colons:
    max-spaces-before: 0
    max-spaces-after: -1  # allow alignment spacing in config files
  document-start: disable  # many files legitimately omit ---
  comments-indentation: disable  # test/config comments don't require strict alignment
  comments:
    min-spaces-from-content: 1  # allow single space before inline comments
